<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Atividades | bringIT</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTjTdDDM6XUowBlBmsyNjafgPuMMJ7Ci1XLB8alGALxgw&s">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="flex h-screen overflow-hidden bg-[#F5F7FA]">

  <!-- Sidebar Lateral Retrátil -->
  <aside id="sidebarMenu" class="w-64 bg-white flex flex-col justify-between border-r border-gray-200 z-20 shadow-sm flex-shrink-0 transition-all duration-300 relative">
    <div>
      <!-- Cabeçalho com Logo Oficial + Botão Retrair -->
      <div class="p-5 border-b border-gray-100 flex items-center justify-between min-h-[73px]">
        <a href="#" id="sidebarLogo" class="block overflow-hidden transition-all duration-300">
          <img src="https://www.bringit.com.br/assets/images/brand/logo-bringit.svg" 
               alt="bringIT" 
               class="h-8 object-contain">
        </a>
        <button onclick="toggleSidebar()" title="Expandir/Recolher Menu" class="w-8 h-8 rounded-xl bg-sky-50 text-[#00A3FF] hover:bg-[#00A3FF] hover:text-white transition flex items-center justify-center flex-shrink-0 shadow-sm border border-sky-100">
          <i id="iconSidebarToggle" class="fa-solid fa-chevron-left text-xs transition-transform duration-300"></i>
        </button>
      </div>
      
      <!-- Navegação das Abas -->
      <nav class="mt-6 space-y-1 px-3">
        <p id="labelMenuOperacional" class="px-3 text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-3 transition-opacity duration-300">Menu Operacional</p>
        
        <button onclick="navegarAba('time')" id="btn-time" title="Time" class="menu-link w-full flex items-center px-3.5 py-3 text-sm rounded-xl transition">
          <i class="fa-solid fa-users text-[#00A3FF] text-base w-6 text-center flex-shrink-0"></i>
          <span class="menu-text font-bold ml-2 transition-opacity duration-300 whitespace-nowrap">Time</span>
        </button>

        <button onclick="navegarAba('marketplace')" id="btn-marketplace" title="Marketplace" class="menu-link w-full flex items-center px-3.5 py-3 text-sm rounded-xl transition">
          <i class="fa-solid fa-store text-[#00A3FF] text-base w-6 text-center flex-shrink-0"></i>
          <span class="menu-text font-bold ml-2 transition-opacity duration-300 whitespace-nowrap">Marketplace</span>
        </button>

        <button onclick="navegarAba('site')" id="btn-site" title="Site" class="menu-link w-full flex items-center px-3.5 py-3 text-sm rounded-xl transition">
          <i class="fa-solid fa-globe text-[#00A3FF] text-base w-6 text-center flex-shrink-0"></i>
          <span class="menu-text font-bold ml-2 transition-opacity duration-300 whitespace-nowrap">Site</span>
        </button>

        <button onclick="navegarAba('biblioteca')" id="btn-biblioteca" title="Biblioteca (FAQ)" class="menu-link w-full flex items-center px-3.5 py-3 text-sm rounded-xl transition">
          <i class="fa-solid fa-book-open text-[#00A3FF] text-base w-6 text-center flex-shrink-0"></i>
          <span class="menu-text font-bold ml-2 transition-opacity duration-300 whitespace-nowrap">Biblioteca (FAQ)</span>
        </button>
      </nav>
    </div>

    <!-- Rodapé Sidebar -->
    <div class="p-3 border-t border-gray-100 text-center">
      <div class="bg-sky-50 rounded-xl p-3 border border-sky-100 transition-all duration-300">
        <p id="footerTitle" class="text-xs font-black text-[#00A3FF] whitespace-nowrap overflow-hidden text-ellipsis">Central Cadastro</p>
        <p id="footerSub" class="text-[11px] text-gray-500 mt-0.5 whitespace-nowrap overflow-hidden text-ellipsis">bringIT E-commerce</p>
      </div>
    </div>
  </aside>

  <!-- Área de Conteúdo Principal -->
  <main class="flex-1 flex flex-col overflow-y-auto">
    
    <!-- Top Bar & Filtros Estilo Profissional -->
    <header class="bg-white border-b border-gray-200 px-8 py-5 sticky top-0 z-10 shadow-sm space-y-4">
      
      <!-- Linha Superior: Título + Busca -->
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-3">
            <h2 id="tituloAba" class="text-2xl font-extrabold text-[#1C275C]">Visualização</h2>
            <span id="contadorResultados" class="hidden sm:inline-flex px-3.5 py-1 text-xs font-black text-[#00A3FF] bg-sky-50 border border-sky-100 rounded-full shadow-sm tracking-wide">0 registros</span>
          </div>
          <p class="text-xs text-gray-500 mt-0.5">Gestão e acompanhamento de processos internos</p>
        </div>
        
        <!-- Barra de Busca -->
        <div class="flex items-center gap-3 w-full lg:w-1/2">
          <div class="relative w-full">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
            <input type="text" id="filtroTexto" oninput="aplicarFiltros()" 
                   placeholder="Busque por responsável, rotina, código ou palavra-chave..." 
                   class="search-input-bringit w-full pl-10 pr-10 py-2.5 text-sm focus:outline-none text-gray-800 placeholder-gray-400">
            <button id="btnLimparBuscaTexto" onclick="limparBuscaTexto()" class="hidden absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 transition">
              <i class="fa-solid fa-circle-xmark text-sm"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Linha Inferior: Dropdowns de Filtro + Tags de Filtros Ativos -->
      <div id="painelFiltrosProfissional" class="pt-3 border-t border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        
        <!-- Dropdowns Gerados Dinamicamente -->
        <div class="flex items-center gap-2 flex-wrap" id="containerFiltrosColunas">
          <!-- Injetado via JS -->
        </div>

        <!-- Botão Limpar Filtros -->
        <div class="flex items-center gap-2 flex-shrink-0">
          <button id="btnLimparTodosFiltros" onclick="limparFiltros()" class="hidden px-3.5 py-1.5 text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 rounded-xl transition flex items-center gap-1.5">
            <i class="fa-solid fa-filter-circle-xmark"></i>
            <span>Limpar Filtros</span>
          </button>
        </div>
      </div>

      <!-- Tags de Filtros Ativos -->
      <div id="containerTagsFiltrosAtivos" class="hidden flex items-center gap-2 flex-wrap pt-1">
        <!-- Injetado via JS -->
      </div>

    </header>

    <!-- Conteúdo Dinâmico da Aba -->
    <section id="conteudoAba" class="p-8">
      <!-- Injetado dinamicamente via JS -->
    </section>
  </main>

  <!-- Carregamento dos Scripts JS da Raiz -->
  <script src="time.js"></script>
  <script src="marketplace.js"></script>
  <script src="filtros.js"></script>
  <script src="site.js"></script>
  <script src="biblioteca.js"></script>
  
  <!-- Lógica Principal -->
  <script src="app.js"></script>
</body>
</html>
