<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Atividades | bringIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="flex h-screen overflow-hidden bg-[#F4F6F9]">

  <!-- Sidebar Lateral (Azul Escuro #1C275C) -->
  <aside class="w-64 bg-[#1C275C] text-white flex flex-col justify-between shadow-xl">
    <div>
      <!-- Cabeçalho com Logo SVG Oficial da bringIT -->
      <div class="p-5 border-b border-blue-900/50 flex items-center justify-center bg-white/5">
        <a href="#" class="block">
          <img src="https://www.bringit.com.br/assets/images/brand/logo-bringit.svg" 
               alt="bringIT" 
               class="h-8 object-contain drop-shadow">
        </a>
      </div>
      
      <!-- Navegação das Abas -->
      <nav class="mt-4">
        <p class="px-5 text-xs font-semibold text-blue-200 uppercase tracking-wider mb-2">Abas do Projeto</p>
        <button onclick="navegarAba('time')" id="btn-time" class="menu-link w-full flex items-center px-5 py-3 text-sm font-medium">
          <i class="fa-solid fa-users w-6"></i> Time
        </button>
        <button onclick="navegarAba('marketplace')" id="btn-marketplace" class="menu-link w-full flex items-center px-5 py-3 text-sm font-medium">
          <i class="fa-solid fa-store w-6"></i> Marketplace
        </button>
        <button onclick="navegarAba('site')" id="btn-site" class="menu-link w-full flex items-center px-5 py-3 text-sm font-medium">
          <i class="fa-solid fa-globe w-6"></i> Site
        </button>
        <button onclick="navegarAba('biblioteca')" id="btn-biblioteca" class="menu-link w-full flex items-center px-5 py-3 text-sm font-medium">
          <i class="fa-solid fa-book-open w-6"></i> Biblioteca (FAQ)
        </button>
      </nav>
    </div>

    <div class="p-4 border-t border-blue-900/50 text-xs text-blue-300 text-center">
      Central de Operações v1.0
    </div>
  </aside>

  <!-- Área de Conteúdo Principal -->
  <main class="flex-1 flex flex-col overflow-y-auto">
    <!-- Header -->
    <header class="bg-white border-b p-5 shadow-sm sticky top-0 z-10">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <h2 id="tituloAba" class="text-2xl font-bold text-[#1C275C]">Visualização</h2>
        
        <!-- Barra de Busca -->
        <div class="flex items-center gap-3 w-full md:w-1/2">
          <div class="relative w-full">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
            <input type="text" id="filtroTexto" oninput="aplicarFiltros()" placeholder="Buscar em todas as colunas..." 
                   class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#00ACFF] text-sm">
          </div>
        </div>
      </div>

      <!-- Filtros Automáticos por Colunas -->
      <div id="containerFiltrosColunas" class="flex flex-wrap gap-3 mt-4 pt-3 border-t">
        <!-- Injetado dinamicamente via JS -->
      </div>
    </header>

    <!-- Conteúdo Dinâmico da Aba -->
    <section id="conteudoAba" class="p-6">
      <!-- Injetado dinamicamente via JS -->
    </section>
  </main>

  <!-- Carregamento de Arquivos Diretamente da Raiz -->
  <script src="time.js"></script>
  <script src="marketplace.js"></script>
  <script src="site.js"></script>
  <script src="biblioteca.js"></script>
  
  <!-- Lógica Principal do Dashboard -->
  <script src="app.js"></script>
</body>
</html>
